name: roqksa
description: Roqksa social voice rooms starter app
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  firebase_core: ^4.15.1
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.10.2
  cloud_functions: ^6.0.5
  firebase_storage: ^13.6.1
  flutter_webrtc: ^1.6.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/icon/roqksa.jpg
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/roqksa.jpg
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/roqksa.jpg
  web:
    generate: true
    image_path: assets/icon/roqksa.jpg
    background_color: "#FFFFFF"
    theme_color: "#350604"
