name: Prepare Android platform

on:
  push:
    branches: [feature/production-foundation]
    paths-ignore:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/production-foundation
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native Android project
        run: flutter create --platforms=android --org com.roqksa .

      - name: Set Android application ID
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          found = False
          for path in candidates:
              if path.exists():
                  path.write_text(path.read_text().replace('com.roqksa.roqksa', 'com.roqksa.app'))
                  found = True
          if not found:
              raise SystemExit("Android app Gradle file was not generated")
          old = Path("android/app/src/main/kotlin/com/roqksa/roqksa")
          new = Path("android/app/src/main/kotlin/com/roqksa/app")
          if old.exists():
              new.mkdir(parents=True, exist_ok=True)
              for file in old.iterdir():
                  source = file.read_text().replace('package com.roqksa.roqksa', 'package com.roqksa.app')
                  (new / file.name).write_text(source)
              shutil.rmtree(old)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              manifest.write_text(manifest.read_text().replace('android:label="roqksa"', 'android:label="Roqksa"'))
          PY

      - name: Generate Android launcher icons from approved Taiger PNG
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("web/icons/roqksa-taiger-icon-512.png")
          if not source.is_file():
              raise SystemExit(f"Approved icon not found: {source}")
          image = Image.open(source).convert("RGBA")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          base = Path("android/app/src/main/res")
          for folder, size in sizes.items():
              target_dir = base / folder
              target_dir.mkdir(parents=True, exist_ok=True)
              resized = image.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(target_dir / "ic_launcher.png", format="PNG", optimize=True)
          print("Generated Android launcher icons from the approved Taiger PNG.")
          PY

      - name: Verify Android package configuration
        run: |
          grep -R -n 'com.roqksa.app' android/app
          flutter pub get
          flutter build apk --release

      - name: Commit Android platform files to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if git diff --cached --quiet; then
            echo "Android platform files are already up to date."
          else
            git commit -m "Use approved Taiger artwork for Android launcher icon"
            git push origin HEAD:feature/production-foundation
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: roqksa-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
