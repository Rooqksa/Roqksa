name: iOS build

on:
  push:
    branches: [main, feature/free-webrtc-audio-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode environment
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter environment
        run: flutter doctor -v

      - name: Generate iOS project
        run: flutter create --platforms=ios --org com.roqksa .

      - name: Declare microphone permission for WebRTC
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'يحتاج Roqksa إلى الميكروفون للمشاركة في الغرف الصوتية.'" ios/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign -v

      - name: Upload unsigned iOS build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: roqksa-ios-unsigned-build
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
