name: Flutter quality checks

on:
  push:
    branches:
      - feature/production-foundation
  pull_request:
    branches:
      - main
      - feature/production-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run widget and unit tests
        run: flutter test --reporter expanded

      - name: Build web release
        run: flutter build web --release --base-href "/Roqksa/"
